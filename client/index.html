<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Help search engines understand your local business and improve local search visibility with accurate structured data."
    />
    <title>LocalSchema AI — Local Business Schema Generator</title>

    <!-- Favicon. SVG covers every modern browser and stays crisp at any size;
         the .ico fallback is only for legacy IE/older Safari pinned tabs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#05524F" />

    <!-- Link previews (Facebook, LinkedIn, Slack, WhatsApp, iMessage).
         og:image must be an ABSOLUTE url — relative paths are ignored by most
         scrapers. Update the domain here if the app moves. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LocalSchema AI" />
    <meta property="og:title" content="LocalSchema AI — Local Business Schema Generator" />
    <meta
      property="og:description"
      content="Validated JSON-LD for local businesses — generated from your own documents and website. Never invented, always verified."
    />
    <meta property="og:url" content="https://ai-local-business-schema-generato-client.onrender.com/" />
    <meta
      property="og:image"
      content="https://ai-local-business-schema-generato-client.onrender.com/og-banner.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LocalSchema AI — Local Business Schema Generator" />
    <meta
      name="twitter:description"
      content="Validated JSON-LD for local businesses — generated from your own documents and website."
    />
    <meta
      name="twitter:image"
      content="https://ai-local-business-schema-generato-client.onrender.com/og-banner.png"
    />
    <script>
      // Apply the saved theme before first paint so dark users don't get a
      // white flash while React boots. ThemeContext owns it from then on.
      (function () {
        try {
          var saved = localStorage.getItem('localschema-theme') || 'system';
          var dark =
            saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable (private mode) — fall back to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
